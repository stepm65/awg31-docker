services:
  awg31:
    build: .
    image: awg31:local
    container_name: awg31
    restart: unless-stopped

    # Минимум привилегий: только NET_ADMIN и доступ к /dev/net/tun.
    cap_drop: [ALL]
    # NET_RAW нужен пробе резервирования (SO_BINDTODEVICE) на ядрах старше 5.7.
    # NET_BIND_SERVICE — DNS-форвардеру на порту 53 (маршрутизация по доменам).
    cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
      # Группы туннелей: потоки делятся по портам, а не по адресам
      net.ipv4.fib_multipath_hash_policy: "1"
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv6.conf.all.forwarding: "1"

    ports:
      # WebUI слушает только localhost хоста. Чтобы открыть доступ из LAN,
      # замените на "192.168.1.10:8443:8443" (адрес хоста в доверенной сети),
      # но не публикуйте порт в интернет.
      - "127.0.0.1:8443:8443/tcp"
      # Режим сервера (профиль с ListenPort = 51820 и пирами без Endpoint):
      # - "51820:51820/udp"

    environment:
      TZ: UTC
      UI_TLS: auto            # auto | files | off
      # UI_TLS_SANS: "router.lan,192.168.1.10"   # дополнительные имена в сертификате
      AWG_AUTO_ROUTE: "on"    # режим шлюза: NAT, MSS-clamp, маршрутизация трафика LAN в туннель
      AWG_KILLSWITCH: "on"    # нет туннеля — трафик LAN отбрасывается, а не уходит мимо VPN
      AWG_ENABLE_IPV6: "on"   # IPv6 в туннеле (NAT66); off — только IPv4
      # AWG_LAN_IFACE: eth0   # по умолчанию интерфейс маршрута по умолчанию
      # DNS_ENABLE: "on"      # DNS-форвардер :53 для правил по доменам (только частные клиенты, см. DNS_ALLOW)
      # AWG_FAILOVER_MODE: standby   # off | standby | switch (дальше — страница «Резервирование»)
      # ALLOW_INSECURE_SUBSCRIPTIONS: "off"      # подписки по http:// (не рекомендуется)
      # TRUSTED_PROXIES: "172.18.0.0/16"         # если WebUI стоит за вашим обратным прокси
      # HEALTH_LISTEN: ":8081"                   # проба для netwatch RouterOS: только код 200/503
      # HEALTH_MAX_HANDSHAKE_SEC: "180"
      #
      # Пароль администратора: либо задайте при первом входе через WebUI по токену
      # из `docker logs awg31`, либо передайте секретом (предпочтительно):
      # ADMIN_PASSWORD_FILE: /run/secrets/awg31_admin_password

    volumes:
      - awg31-data:/data

    # Рабочие копии конфигов (с приватными ключами) живут только в памяти.
    tmpfs:
      - /run/awg31:mode=0700,size=8m

    # secrets:
    #   - awg31_admin_password

volumes:
  awg31-data: {}

# secrets:
#   awg31_admin_password:
#     file: ./secrets/admin_password.txt
