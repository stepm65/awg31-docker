name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # зависимостей нет (только stdlib), go.sum отсутствует
      - name: gofmt
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "запустите gofmt -w ."; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test (с детектором гонок)
        run: go test -race -count=1 ./...
      - name: "JS - проверка синтаксиса"
        run: node --check internal/web/static/app.js
      - name: entrypoint (сценарии Docker и RouterOS)
        run: sh scripts/test-entrypoint.sh
      - name: RouterOS app.yaml по схеме
        run: |
          pip install --quiet jsonschema pyyaml
          python3 scripts/validate-app-yaml.py routeros/app.yaml

  test-arm:
    # Тесты на эмулированных arm64 и ARMv7 (MikroTik): ловят ошибки 32-битных
    # платформ (выравнивание, переполнение int), которых нет на amd64.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goarch: arm64, goarm: "", qemu: qemu-aarch64 }
          - { goarch: arm, goarm: "7", qemu: qemu-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # зависимостей нет (только stdlib), go.sum отсутствует
      - run: sudo apt-get update -q && sudo apt-get install -y -q qemu-user
      - name: go test (${{ matrix.goarch }}${{ matrix.goarm }})
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go test -count=1 -exec ${{ matrix.qemu }} ./...

  image:
    needs: [test, test-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Версия (единственный источник — файл VERSION)
        id: ver
        run: |
          v="$(tr -d ' \n' < VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "${GITHUB_REF_NAME#v}" != "$v" ]]; then
              echo "тег ${GITHUB_REF_NAME} не совпадает с VERSION ($v)" >&2
              exit 1
            fi
            echo "version=$v" >> "$GITHUB_OUTPUT"
          else
            echo "version=${v}-dev" >> "$GITHUB_OUTPUT"
          fi
      - name: Вход в GHCR (только для тегов)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Сборка multi-arch (публикация только для тегов)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Сборка amd64 для проверки запуска
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: awg31:smoke
          cache-from: type=gha
      - name: Запуск образа (tini, веб-консоль, ip rule, остановка)
        run: |
          set -eu
          docker run -d --name smoke --cap-add NET_ADMIN --device /dev/net/tun \
            --sysctl net.ipv4.ip_forward=1 awg31:smoke
          ok=""
          for i in $(seq 1 30); do
            if docker exec smoke wget -qO- -T 2 --no-check-certificate https://127.0.0.1:8443/healthz 2>/dev/null | grep -q ok; then ok=1; break; fi
            sleep 1
          done
          docker logs smoke
          [ -n "$ok" ] || { echo "веб-консоль не ответила" >&2; exit 1; }
          pid1="$(docker exec smoke cat /proc/1/comm)"
          [ "$pid1" = "tini" ] || { echo "PID 1: $pid1, ожидался tini" >&2; exit 1; }
          docker exec smoke ip -4 rule show | grep -q 'lookup local' || { echo "нет ip rule lookup local" >&2; exit 1; }
          if docker exec smoke sh -c 'cat /proc/[0-9]*/stat' | awk '$3 == "Z"' | grep -q .; then echo "есть зомби-процессы" >&2; exit 1; fi
          start=$(date +%s)
          docker stop -t 20 smoke >/dev/null
          took=$(( $(date +%s) - start ))
          code="$(docker inspect -f '{{.State.ExitCode}}' smoke)"
          echo "остановка: ${took} с, код $code"
          [ "$took" -lt 15 ] || { echo "контейнер не остановился по SIGTERM" >&2; exit 1; }

  routeros-tars:
    # Офлайн-архивы для MikroTik (/container/add file=...): прикрепляются к релизу.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Сборка .tar (arm64, arm/v7, amd64 для CHR)
        run: scripts/build-routeros.sh linux/arm64 linux/arm/v7 linux/amd64
      - name: Публикация в релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Название релиза — только версия, описание пустое. Если релиз уже есть (повторный запуск
          # на том же теге), текст в нём тоже очищается.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes ""
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes ""
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.tar dist/SHA256SUMS routeros/*.rsc routeros/app.yaml --clobber
